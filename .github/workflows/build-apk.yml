name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"

jobs:
  apk:
    name: "APK"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1
    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v4

      - name: "Setup Java"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key lets new builds update the installed app instead of
      # needing an uninstall. Add repository secrets KEYSTORE_B64 (base64 of the keystore),
      # KEYSTORE_PASSWORD, KEYSTORE_ENTRY_ALIAS and KEYSTORE_ENTRY_PASSWORD to enable it.
      - name: "Prepare signing key"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "RE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RE_KEY_ALIAS=$KEYSTORE_ENTRY_ALIAS"
              echo "RE_KEY_PASSWORD=$KEYSTORE_ENTRY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository key"
          else
            echo "No signing key secret: the build is signed with a temporary debug key"
          fi

      - name: "Build optimized APK"
        run: "./gradlew --no-daemon :play-services-core:assembleDefaultRelease -PdebugSignRelease=true"

      - name: "List built APKs"
        run: |
          find play-services-core/build/outputs -name '*.apk' -exec ls -l {} \;

      - name: "Upload APK"
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: microg-debug-apk
          path: "play-services-core/build/outputs/apk/**/*.apk"
          if-no-files-found: error

      - name: "Show artifact result"
        run: |
          echo "artifact-id=${{ steps.upload.outputs.artifact-id }}"
          echo "artifact-url=${{ steps.upload.outputs.artifact-url }}"

      - name: "Publish APK as a release (manual runs only)"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find play-services-core/build/outputs/apk -name '*.apk' | head -n 1)
          gh release create "debug-${{ github.run_number }}" "$APK" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "v1.0 - Build ${{ github.run_number }}" \
            --notes "Optimized APK built from ${{ github.sha }}."
